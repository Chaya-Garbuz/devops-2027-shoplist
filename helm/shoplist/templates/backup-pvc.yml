{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim                 # which resource requests persistent storage? (three words, no spaces)
metadata:
  name: backup-pvc
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce                 # only one node writes at a time
  resources:
    requests:
      storage: {{ .Values.backup.storage }}        # how much space? one gigabyte
{{- end }}
